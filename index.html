<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>A Message For You 💌</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="glow"></div>
        <div class="glow glow-two"></div>

        <div class="heart heart-one">♡</div>
        <div class="heart heart-two">♡</div>
        <div class="heart heart-three">♡</div>
        <div class="heart heart-four">♡</div>
    </div>


    <!-- OPENING -->

    <main id="welcome" class="screen">

        <div class="card">

            <div class="label">
                YOU HAVE A MESSAGE
            </div>

            <h1>
                A Letter<br>
                For You.
            </h1>

            <p>
                Take a moment before opening it.
            </p>

            <button
                id="openButton"
                class="main-button">

                Tap anywhere to begin

            </button>

        </div>

    </main>


    <!-- MESSAGE -->

    <main
        id="messageScreen"
        class="screen hidden">

        <div class="message-card">

            <div class="envelope">
                💌
            </div>

            <div class="label">
                A MESSAGE FOR YOU
            </div>

            <div
                id="message"
                class="message">
            </div>

            <div class="line"></div>

            <p class="signature">
                — Someone who cares for you<3
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
