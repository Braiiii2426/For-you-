<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Message For You 💌</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="glow"></div>
        <div class="glow second"></div>

        <div class="heart heart1">♡</div>
        <div class="heart heart2">♡</div>
        <div class="heart heart3">♡</div>
        <div class="heart heart4">♡</div>
    </div>


    <!-- OPENING PAGE -->

    <section id="welcome" class="screen">

        <div class="card">

            <div class="label">
                A MESSAGE FROM ℬℛ𝒴
            </div>

            <h1>
                A Letter<br>
                For You.
            </h1>

            <p>
                Take a moment.
            </p>

            <button id="openButton">
                Tap Anywhere To Begin
            </button>

        </div>

    </section>


    <!-- MESSAGE PAGE -->

    <section id="messageScreen" class="screen hidden">

        <div class="card message-card">

            <div class="envelope">
                💌
            </div>

            <div class="label">
                A MESSAGE FOR YOU
            </div>

            <div id="message">
            </div>

            <div class="line">
            </div>

            <p class="signature">
                — MIDN/1CL BALCITA
            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
